name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JS dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;25.1.8937393" "cmake;3.22.1" >/dev/null 2>&1 || true

      # debug.keystore is committed (mobile/android/app/debug.keystore) so every
      # build — local or CI — shares one signature and installs as an in-place
      # update over the previous one. Only regenerate it if it's ever missing
      # (e.g. a fork that dropped it), which would break auto-update for that
      # build but shouldn't fail CI outright.
      - name: Ensure debug keystore exists
        working-directory: mobile/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore missing, generating a throwaway one — APKs signed this run won't match previous releases for in-place updates."
            keytool -genkeypair -v -storetype PKCS12 -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleRelease -x lint -x test --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: speack3-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Speack3 APK (latest release build)
          body: |
            APK built automatically by CI from the latest branch (release build
            type, signed with the shared debug.keystore — not a Play Store
            release). Install on Android (enable "Install unknown apps").
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

# Render Blueprint — one-click deploy of the Speack3 server.
# https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render click "New + > Blueprint"
# and select the repo (or use the "Deploy to Render" button in the README).
# Render supports WebSocket on the free plan.
#
# The free plan's filesystem is ephemeral, so the app must NOT fall back to the
# NeDB file store here: every account and message would be wiped on each
# redeploy and on each wake-from-idle. Set MONGODB_URI (e.g. a free MongoDB
# Atlas cluster) and the server switches to MongoDB automatically — see
# server/config/database.js.
services:
  - type: web
    name: speack3-server
    runtime: docker
    repo: https://github.com/BTCWFD/Speack3
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      # Connection string for the MongoDB Atlas cluster. Marked sync:false so
      # Render prompts for it in the dashboard instead of keeping the secret in
      # this repo. Without it the server would use the ephemeral NeDB store.
      - key: MONGODB_URI
        sync: false
